name: 系统清理工具
version: "2.5.0"
slug: system_cleanup_tool
description: 一键清理 Home Assistant 历史数据库、系统日志、构建缓存与系统垃圾
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
hassio_api: true
homeassistant_api: true
host_pid: true
full_access: true
docker_api: true
privileged:
  - SYS_ADMIN
  - SYS_PTRACE
  - DAC_READ_SEARCH
apparmor: false
ingress: true
ingress_port: 8099
healthcheck: wget -q -O /dev/null http://127.0.0.1:8099/api/status || exit 1
watchdog: "http://[HOST]:8099/api/status"
panel_admin: true
panel_icon: mdi:broom
panel_title: 系统清理
map:
  - homeassistant_config:rw
options:
  purge_keep_days: 7
  journal_vacuum_size_mb: 100
schema:
  purge_keep_days: int(0,365)
  journal_vacuum_size_mb: int(10,2000)
