<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>系统清理</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa;
    --card: #ffffff;
    --card-hover: #f7f7fa;
    --border: #d8d8d8;
    --text: #171b20;
    --text-dim: #7b818d;
    --title: #171b20;
    --primary: #03a9f4;
    --primary-dark: #0288d1;
    --success: #19be5d;
    --warning: #f97316;
    --danger: #e8453c;
    --radius: 12px;
    /* 刷新按钮专属色 */
    --refresh-bg: #ffffff;
    --refresh-border: #d8d8d8;
    --refresh-icon: #7b818d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111111;
      --card: #181818;
      --card-hover: #232323;
      --border: #363636;
      --text: #e8e8e8;
      --text-dim: #a0a0a0;
      --title: #ffffff;
      --refresh-bg: #181818;
      --refresh-border: #363636;
      --refresh-icon: #a0a0a0;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC",
      "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh; /* 移动端动态视口, HA App/Safari 地址栏收放时仍撑满全屏 */
    padding-bottom: calc(96px + env(safe-area-inset-bottom)); /* 固定底栏高度 + 安全区 */
    font-size: 15px;
  }
  .page { max-width: 1378px; margin: 0 auto; padding: 24px clamp(30px, 4vw, 64px) 30px; }

  /* 顶栏 */
  .topbar { display: flex; align-items: center; gap: 24px; margin-bottom: 24px; }
  .topbar h1 { font-size: 22px; font-weight: 600; line-height: 1.1; letter-spacing: 0.5px; color: var(--title); flex: 1; }
  .topbar .sub { font-size: 12px; line-height: 1.3; color: #9a9a9a; margin-top: 8px; }
  .refresh-btn {
    background: var(--refresh-bg); border: 1px solid var(--refresh-border);
    color: var(--refresh-icon);
    border-radius: 50%; width: 46px; height: 46px; flex-shrink: 0;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: color .15s, border-color .15s;
  }
  .refresh-btn:hover { color: var(--text); border-color: var(--refresh-icon); }
  .refresh-btn svg { width: 22px; height: 22px; }
  /* 刷新中: 图标旋转 */
  .refresh-btn.loading svg { animation: spin 1s linear infinite; }
  @media (max-width: 980px) {
    .page { padding: 54px 30px 64px; }
  }
  @media (max-width: 700px) {
    .refresh-btn { width: 40px; height: 40px; }
    .refresh-btn svg { width: 20px; height: 20px; }
    .page { padding: 40px 30px 60px; }
    .topbar .sub { margin-top: 4px; }
  }

  /* 磁盘卡片 */
  .disk-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; margin-bottom: 14px;
  }
  .disk-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .disk-label { font-size: 13px; color: var(--text-dim); }
  .disk-value { font-size: 15px; font-weight: 600; }
  .disk-value small { font-weight: 400; color: var(--text-dim); font-size: 12px; }
  .disk-bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .disk-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--primary), #29b6f6); transition: width .6s ease; }
  .disk-fill.warn { background: linear-gradient(90deg, var(--warning), #fb923c); }
  .disk-fill.crit { background: linear-gradient(90deg, var(--danger), #f0716a); }

  /* 结果横幅 */
  .banner {
    display: none; align-items: center; gap: 10px; border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 14px; font-size: 14px; border: 1px solid;
  }
  .banner.ok { display: flex; background: rgba(25,190,93,.12); border-color: rgba(25,190,93,.4); color: #19be5d; }
  .banner.running {
    display: flex; background: rgba(249,115,22,.14);
    border-color: rgba(249,115,22,.45); color: #f97316;
  }
  .banner.running svg { animation: spin 1.2s linear infinite; }
  .banner svg { width: 20px; height: 20px; flex-shrink: 0; }

  /* 选择栏 */
  .select-bar { display: flex; justify-content: space-between; align-items: center; margin: 18px 0 10px; }
  .select-bar .title { font-size: 15px; font-weight: 600; color: var(--text); }
  .link-btn { background: none; border: none; color: var(--primary); font-size: 13px; cursor: pointer; padding: 4px 6px; }

  /* 清理项列表 */
  .items { display: flex; flex-direction: column; gap: 10px; }
  .item {
    display: flex; align-items: center; gap: 14px;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; cursor: pointer; transition: background .15s, border-color .15s;
    user-select: none;
  }
  .item:hover { background: var(--card-hover); }
  .item.disabled { opacity: .45; cursor: not-allowed; }
  .item.running {
    border-color: var(--primary);
    box-shadow: 0 0 0 1px var(--primary) inset;
    background: var(--card-hover);
  }
  .item-name .running-tag { color: var(--primary); font-size: 11px; font-weight: 500; margin-left: 6px; }

  .checkbox {
    width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--border);
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    transition: all .15s; position: relative;
  }
  .item.checked .checkbox { background: var(--primary); border-color: var(--primary); }
  .checkbox svg { width: 14px; height: 14px; color: #fff; opacity: 0; transform: scale(.5); transition: all .15s; }
  .item.checked .checkbox svg { opacity: 1; transform: scale(1); }

  .item-icon {
    width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(3,169,244,.12);
  }
  .item-icon.d1 { background: rgba(249,115,22,.12); }
  .item-icon.d1 svg { color: var(--warning); }
  .item-icon.d2 { background: rgba(232,69,60,.12); }
  .item-icon.d2 svg { color: var(--danger); }
  .item-icon svg { width: 20px; height: 20px; color: var(--primary); }

  .item-body { flex: 1; min-width: 0; }
  .item-name { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
  .item-desc { font-size: 12.5px; color: var(--text-dim); line-height: 1.4; }

  .item-meta { text-align: right; flex-shrink: 0; }
  .size-badge {
    display: inline-block; font-size: 13px; font-weight: 600; color: var(--primary);
    background: rgba(3,169,244,.1); padding: 3px 10px; border-radius: 8px;
  }
  .size-badge.zero { color: var(--text-dim); background: var(--border); }
  .size-badge.unknown { color: var(--warning); background: rgba(249,115,22,.1); }
  .freed-text { font-size: 12px; color: var(--success); margin-top: 4px; font-weight: 600; }

  /* 执行中的状态图标 */
  .status-icon { width: 22px; height: 22px; flex-shrink: 0; display: none; }
  .spinner { animation: spin 1s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .err-text { font-size: 11.5px; color: var(--danger); margin-top: 4px; max-width: 180px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 底部操作栏: 桌面与移动端均固定贴底 */
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--card); border-top: 1px solid var(--border);
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    z-index: 10;
  }
  .bottom-inner {
    max-width: 1378px; margin: 0 auto; padding: 0 16px;
    display: flex; align-items: center; gap: 16px;
  }
  .total-info { flex: 1; }
  .total-label { font-size: 12px; color: var(--text-dim); margin-bottom: 2px; }
  .total-value { font-size: 18px; font-weight: 700; color: var(--primary); }
  .total-value.none { color: var(--text-dim); }

  .clean-btn {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff; border: none; border-radius: 14px;
    font-size: 16px; font-weight: 600; padding: 14px 34px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(3,169,244,.35);
    transition: transform .1s, box-shadow .15s, opacity .15s;
    display: flex; align-items: center; gap: 8px;
  }
  .clean-btn:active { transform: scale(.97); }
  .clean-btn:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }
  .clean-btn svg { width: 18px; height: 18px; }

  /* 遮罩提示 */
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: #333; color: #fff; font-size: 14px; padding: 10px 20px;
    border-radius: 10px; z-index: 99; opacity: 0; transition: opacity .3s;
    pointer-events: none; max-width: 90vw;
  }
  .toast.show { opacity: 1; }

  .loading-page { display: flex; align-items: center; justify-content: center; padding: 60px 0; color: var(--text-dim); gap: 10px; }
  .loading-page svg { width: 22px; height: 22px; }
</style>
</head>
<body>
<div class="page">

  <div class="topbar">
    <div style="flex:1">
      <h1>系统清理</h1>
      <div class="sub" id="subTitle">Home Assistant 系统垃圾一键清理</div>
    </div>
    <button class="refresh-btn" id="refreshBtn" title="刷新">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
    </button>
  </div>

  <div class="disk-card">
    <div class="disk-row">
      <span class="disk-label">磁盘使用情况</span>
      <span class="disk-value" id="diskText">加载中…</span>
    </div>
    <div class="disk-bar"><div class="disk-fill" id="diskFill" style="width:0%"></div></div>
  </div>

  <div class="banner ok" id="banner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    <span id="bannerText"></span>
  </div>

  <div class="select-bar">
    <span class="title">选择要清理的项目</span>
    <button class="link-btn" id="toggleAllBtn">全选</button>
  </div>

  <div class="items" id="itemList">
    <div class="loading-page">
      <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.22-8.56"/></svg>
      正在扫描系统…
    </div>
  </div>

  <div class="bottom-bar">
    <div class="bottom-inner">
      <div class="total-info">
        <div class="total-label">预计可释放</div>
        <div class="total-value none" id="totalValue">0 B</div>
      </div>
      <button class="clean-btn" id="cleanBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v6H3z"/><path d="M21 9v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9"/><path d="M9 13h6"/></svg>
        <span id="cleanBtnText">一键清理</span>
      </button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const ICONS = {
  recorder_db: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>',
  journal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M4 9h16"/><path d="M9 4v16"/><path d="M13 13h4"/><path d="M13 17h4"/></svg>',
  esphome_cache: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3"/><path d="M15 1v3"/><path d="M9 20v3"/><path d="M15 20v3"/><path d="M20 9h3"/><path d="M20 14h3"/><path d="M1 9h3"/><path d="M1 14h3"/></svg>',
  z2m_logs: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1"/></svg>',
  docker_images: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>',
};
const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
const SPINNER_SVG = '<svg class="spinner status-icon" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.22-8.56"/></svg>';
const DONE_SVG = '<svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="display:block"><polyline points="20 6 9 17 4 12"/></svg>';
const ERROR_SVG = '<svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="display:block"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';

const DANGER_LABELS = ['', '清理后需重建/影响运行记录', '删除后不可恢复'];

let items = [];          // 服务端返回的清理项
let checked = new Set(); // 勾选状态
let running = false;
let pollTimer = null;

const $ = (id) => document.getElementById(id);

function fmtSize(num) {
  if (num < 0) return '未知';
  const units = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0;
  while (num >= 1024 && i < units.length - 1) { num /= 1024; i++; }
  return i === 0 ? `${num} B` : `${num.toFixed(1)} ${units[i]}`;
}

function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3200);
}

// ---------------------------------------------------------------------------
// 渲染
// ---------------------------------------------------------------------------

function renderDisk(disk) {
  const { total, used } = disk;
  if (!total) { $('diskText').textContent = '无法获取'; return; }
  const pct = Math.round((used / total) * 100);
  $('diskText').innerHTML =
    `${fmtSize(used)} <small>/ ${fmtSize(total)}</small>`;
  const fill = $('diskFill');
  fill.style.width = Math.min(pct, 100) + '%';
  fill.className = 'disk-fill' + (pct >= 90 ? ' crit' : pct >= 75 ? ' warn' : '');
}

function renderItems() {
  const list = $('itemList');
  list.innerHTML = '';
  items.forEach((it) => {
    const el = document.createElement('div');
    el.className = 'item' + (checked.has(it.id) ? ' checked' : '');
    el.dataset.id = it.id;

    const sizeCls = it.size < 0 ? 'unknown' : (it.size === 0 ? 'zero' : '');
    const sizeTxt = it.size < 0 ? '未知' : fmtSize(it.size);

    el.innerHTML = `
      <div class="checkbox">${CHECK_SVG}</div>
      ${ICONS[it.id] ? `<div class="item-icon d${it.danger}">${ICONS[it.id]}</div>` : ''}
      <div class="item-body">
        <div class="item-name">${it.name}${it.danger >= 2 ? ' <span style="color:var(--danger);font-size:11px;font-weight:500">⚠ 不可恢复</span>' : ''}</div>
        <div class="item-desc">${it.param} · ${DANGER_LABELS[it.danger] || '可安全清理'}</div>
        ${it.error ? `<div class="item-desc" style="color:#f5a623;margin-top:2px">⚠ ${it.error}</div>` : ''}
      </div>
      <div class="item-meta">
        <span class="size-badge ${sizeCls}">${sizeTxt}</span>
        <div class="freed-text" data-freed></div>
        <div class="err-text" data-err></div>
      </div>`;
    el.addEventListener('click', () => {
      if (running) return;
      if (checked.has(it.id)) checked.delete(it.id); else checked.add(it.id);
      el.classList.toggle('checked', checked.has(it.id));
      updateTotal();
    });
    list.appendChild(el);
  });
  updateTotal();
}

function updateTotal() {
  const total = items.filter((it) => checked.has(it.id))
    .reduce((sum, it) => sum + Math.max(it.size, 0), 0);
  const el = $('totalValue');
  el.textContent = fmtSize(total);
  el.className = 'total-value' + (total ? '' : ' none');
  const allChecked = items.length > 0 && checked.size === items.length;
  $('toggleAllBtn').textContent = allChecked ? '取消全选' : '全选';
}

// ---------------------------------------------------------------------------
// 数据加载
// ---------------------------------------------------------------------------

async function loadInfo() {
  try {
    const resp = await fetch('api/info');
    const data = await resp.json();
    if (!data.ok) throw new Error(data.error || '加载失败');
    items = data.items;
    checked = new Set(items.filter((it) => it.checked).map((it) => it.id));
    renderDisk(data.disk);
    renderItems();
    $('subTitle').textContent = 'Home Assistant 系统垃圾一键清理';
    const lr = data.last_run;
    if (lr && lr.interrupted) {
      $('subTitle').textContent = '上次清理被插件重启中断，清理结果未知';
    } else if (lr && lr.finished_at) {
      const d = new Date(lr.finished_at * 1000);
      const pad = (n) => String(n).padStart(2, '0');
      const count = (lr.results || []).length;
      $('subTitle').textContent =
        `上次清理 ${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}` +
        ` · ${count} 项 · 释放 ${fmtSize(lr.total_freed || 0)}`;
    }
  } catch (err) {
    $('itemList').innerHTML =
      `<div class="loading-page">加载失败: ${err.message}，请确认 Add-on 运行正常</div>`;
  } finally {
    $('refreshBtn').classList.remove('loading');
  }
}

// ---------------------------------------------------------------------------
// 清理执行
// ---------------------------------------------------------------------------

async function startClean() {
  if (!checked.size) { toast('请先勾选要清理的项目'); return; }

  const risky = items.filter((it) => checked.has(it.id) && it.danger >= 2);
  if (risky.length && !confirm(`确定要删除「${risky.map((r) => r.name).join('、')}」吗？\n该操作不可恢复！`)) {
    return;
  }

  try {
    const resp = await fetch('api/clean', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items: [...checked] }),
    });
    const data = await resp.json();
    if (!data.ok) { toast(data.error || '启动失败'); return; }
  } catch (err) {
    toast('请求失败: ' + err.message);
    return;
  }

  running = true;
  $('banner').style.display = 'none';
  $('cleanBtn').disabled = true;
  $('cleanBtnText').textContent = '清理中…';
  setItemsRunningMode();
  pollTimer = setInterval(pollStatus, 1200);
}

function setItemsRunningMode() {
  document.querySelectorAll('.item').forEach((el) => {
    el.classList.add('disabled');
    const cb = el.querySelector('.checkbox');
    cb.innerHTML = SPINNER_SVG;
    cb.style.border = 'none';
    cb.style.background = 'transparent';
    cb.style.display = 'flex';
    cb.style.alignItems = 'center';
  });
}

function applyStatus(status) {
  const doneIds = new Set(status.results.map((r) => r.id));
  const resultMap = {};
  status.results.forEach((r) => { resultMap[r.id] = r; });

  const doneCount = status.results.length;
  const totalCount = status.selected_total || doneCount;

  document.querySelectorAll('.item').forEach((el) => {
    const id = el.dataset.id;
    const cb = el.querySelector('.checkbox');
    const freedEl = el.querySelector('[data-freed]');
    const errEl = el.querySelector('[data-err]');
    const nameEl = el.querySelector('.item-name');

    // 清除上一轮的"清理中"标记
    el.classList.remove('running');
    const oldTag = nameEl.querySelector('.running-tag');
    if (oldTag) oldTag.remove();

    if (id === status.current && !resultMap[id]) {
      // 当前执行中: 转圈 + 高亮 + 标记
      cb.innerHTML = SPINNER_SVG;
      el.classList.add('running');
      const tag = document.createElement('span');
      tag.className = 'running-tag';
      tag.textContent = '正在清理…';
      nameEl.appendChild(tag);
      return;
    }
    const result = resultMap[id];
    if (!result) return;

    if (result.status === 'done') {
      cb.innerHTML = DONE_SVG;
      freedEl.textContent = `已释放 ${fmtSize(result.freed)}`;
    } else {
      cb.innerHTML = ERROR_SVG;
      errEl.textContent = result.msg || '清理失败';
      errEl.title = result.msg || '';
    }
  });

  if (status.running) {
    // 进度反馈: 按钮计数 + 顶部横幅显示当前项
    $('cleanBtnText').textContent = `清理中 (${doneCount}/${totalCount})…`;
    const secs = status.started_at ? Math.round((Date.now() / 1000) - status.started_at) : 0;
    $('bannerText').textContent =
      `正在清理: ${status.current_name || '…'}（第 ${doneCount + 1}/${totalCount} 项，已进行 ${secs} 秒）` +
      (status.current === 'docker_images' || status.current === 'recorder_db'
        ? '，数据量较大时需数分钟，请耐心等待' : '');
    $('banner').classList.remove('ok');
    $('banner').classList.add('running');
    $('banner').style.display = 'flex';
    return;
  }

  if (!status.running && status.finished_at) {
    clearInterval(pollTimer);
    running = false;
    $('cleanBtn').disabled = false;
    $('cleanBtnText').textContent = '一键清理';
    const errors = status.results.filter((r) => r.status === 'error');
    $('bannerText').textContent =
      `清理完成，共释放 ${fmtSize(status.total_freed)}` +
      (errors.length ? `（${errors.length} 项失败，见列表）` : '，磁盘空间已回收');
    $('banner').classList.remove('running');
    $('banner').classList.add('ok');
    $('banner').style.display = 'flex';
    setTimeout(() => { loadInfo(); }, 1500);
  }
}

async function pollStatus() {
  try {
    const resp = await fetch('api/status');
    applyStatus(await resp.json());
  } catch (err) {
    console.error(err);
  }
}

// ---------------------------------------------------------------------------
// 事件绑定
// ---------------------------------------------------------------------------

$('cleanBtn').addEventListener('click', startClean);
$('refreshBtn').addEventListener('click', () => {
  if (running) return;
  toast('正在重新扫描…');
  $('refreshBtn').classList.add('loading');
  loadInfo();
});
$('toggleAllBtn').addEventListener('click', () => {
  if (running) return;
  const allChecked = items.length > 0 && checked.size === items.length;
  checked = allChecked ? new Set() : new Set(items.map((it) => it.id));
  document.querySelectorAll('.item').forEach((el) => {
    el.classList.toggle('checked', checked.has(el.dataset.id));
  });
  updateTotal();
});

// 启动时若已有进行中的任务(页面刷新), 直接进入轮询
(async () => {
  await loadInfo();
  try {
    const resp = await fetch('api/status');
    const status = await resp.json();
    if (status.running) {
      running = true;
      $('cleanBtn').disabled = true;
      $('cleanBtnText').textContent = '清理中…';
      setItemsRunningMode();
      pollTimer = setInterval(pollStatus, 1200);
    }
  } catch (err) { /* ignore */ }
})();
</script>
</body>
